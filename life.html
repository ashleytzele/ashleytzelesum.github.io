.cv-it:hover .cap,.cv-it.kf .cap{opacity:1;translate:0 0}
.cv-it.kf{outline:2px solid var(--ink);outline-offset:2px}
.cv-lab{position:absolute;left:0;top:0;font:800 clamp(1.6rem,2.4vw,2.4rem)/1 var(--display);font-stretch:115%;letter-spacing:-.05em;color:var(--ink);white-space:nowrap;will-change:transform;pointer-events:none}
.cv-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:8px;pointer-events:none;z-index:2}
.cv-chips{display:flex;gap:4px;padding:5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(17,17,19,.08);overflow-x:auto;scrollbar-width:none;max-width:100%;pointer-events:auto}
.cv-chips::-webkit-scrollbar{display:none}
.cv-chips button{font:600 .84rem/1 var(--body);padding:.6rem .85rem;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.cv-chips button:hover{background:var(--mid)}
.cv-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cv-x{display:none;pointer-events:auto;font:600 .84rem/1 var(--body);padding:.75rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.cv-hint{position:absolute;left:50%;bottom:14px;translate:-50% 0;margin:0;font:600 .8rem/1 var(--body);background:var(--ink);color:var(--bg);padding:.55rem .85rem;border-radius:999px;pointer-events:none;transition:opacity .4s;z-index:2}
.cv.moved .cv-hint{opacity:0}
.cv.fs{position:fixed;inset:0;height:100vh;height:100dvh;margin:0;z-index:70;border:0;touch-action:none}
.cv.fs .cv-x{display:block}
html.cv-lock{overflow:hidden}
.lb{position:fixed;inset:0;z-index:90;background:rgba(233,233,235,.97);display:none;place-items:center;padding:64px 4vw 4vw}
.lb.on{display:grid}
.lb figure{margin:0;display:grid;justify-items:center;gap:.7rem}
.lb img,.lb video{max-width:100%;max-height:80vh;border-radius:8px;display:block}
.lb figcaption{font-size:.95rem}
.lb figcaption span{color:var(--muted);margin-left:.5rem}
.lb-ctl{position:fixed;top:12px;right:12px;display:flex;gap:6px}
.lb-ctl button{font:600 .88rem/1 var(--body);padding:.7rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}

    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

    /* layout: Cosmos-style masonry with one even gap, but columns come in different widths,
       so photos land in a mix of small, medium and large. Each column repeats on its own vertically
       and the column pattern repeats sideways, so the wall never has holes */
    var GAP = small ? 8 : 12;
    var WIDTHS = small ? [104, 140, 190] : [170, 240, 330];
    var seed = 20261111; function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    ITEMS.forEach(function (it, i) { it.i = i; });
    var NC = small ? 9 : 14, cols = [], prev = -1;
    for (var c = 0; c < NC; c++) {
      var k; do { k = Math.floor(rnd() * WIDTHS.length); } while (k === prev && rnd() < .7);
      prev = k; cols.push({ w: WIDTHS[k], h: 0, items: [] });
    }
    var xs = 0; cols.forEach(function (c) { c.x = xs; xs += c.w + GAP; });
    var TW = xs;
    /* spread photos out, then drop each into the column that is shortest relative to its width */
    var order = ITEMS.slice(); for (var q = order.length - 1; q > 0; q--) { var r = Math.floor(rnd() * (q + 1)), t = order[q]; order[q] = order[r]; order[r] = t; }
    order.forEach(function (it) {
      var best = 0, bv = 1e12;
      cols.forEach(function (c, ci) { var v = c.h / c.w + (it.type === 'video' && c.w === WIDTHS[0] ? 3 : 0); if (v < bv) { bv = v; best = ci; } });
      var c = cols[best];
      it.ww = c.w; it.hh = Math.round(c.w * it.h / it.w); it.x = c.x; it.y = c.h; it.col = best;
      c.h += it.hh + GAP; c.items.push(it);
    });
    var cam = { x: TW / 2 - cv.clientWidth / 2, y: 0 }, vel = { x: 0, y: 0 };
    var live = {}, raf = null, lastAct = 0;

    function node(key, it) {
      var el = document.createElement('figure');
      el.className = 'cv-it'; el.setAttribute('data-i', it.i);
      el.style.width = it.ww + 'px'; el.style.height = it.hh + 'px';
      el.innerHTML = (it.type === 'video'
        ? '<video src="' + esc(it.src) + '" poster="' + esc(it.th) + '" muted loop playsinline' + (still ? '' : ' autoplay') + ' preload="metadata"></video>'
        : '<img src="' + esc(it.th) + '" alt="' + esc(it.t) + '" decoding="async" draggable="false">') + '<span class="cap" aria-hidden="true">' + esc(it.t) + '</span>';
      world.appendChild(el); return el;
    }
    function draw() {
      var W = cv.clientWidth, H = cv.clientHeight, M = 300, seen = {};
      var t0 = Math.floor((cam.x - M) / TW), t1 = Math.floor((cam.x + W + M) / TW);
      for (var tx = t0; tx <= t1; tx++) {
        for (var ci = 0; ci < cols.length; ci++) {
          var col = cols[ci], X = tx * TW + col.x - cam.x;
          if (X > W + M || X + col.w < -M) continue;
          var CH = col.h, r0 = Math.floor((cam.y - M) / CH), r1 = Math.floor((cam.y + H + M) / CH);
          for (var r = r0; r <= r1; r++) for (var i = 0; i < col.items.length; i++) {
            var it = col.items[i], Y = r * CH + it.y - cam.y;
            if (Y > H + M || Y + it.hh < -M) continue;
            var key = it.i + ':' + tx + ':' + r; seen[key] = 1;
            var el = live[key] || (live[key] = node(key, it));
            el.style.transform = 'translate3d(' + X.toFixed(1) + 'px,' + Y.toFixed(1) + 'px,0)';
          }
        }
      }
      for (var q in live) if (!seen[q]) { live[q].remove(); delete live[q]; }
    }
    function tick() {
      raf = null;
      var idle = performance.now() - lastAct > 2000;
      if (!dragging && (Math.abs(vel.x) > .05 || Math.abs(vel.y) > .05)) { cam.x += vel.x; cam.y += vel.y; vel.x *= .94; vel.y *= .94; }
      else if (!dragging && idle && !still && !anim && inView) { cam.x += .35; cam.y += .17; }
      if (anim) {
        var t = Math.min(1, (performance.now() - anim.t0) / 700), e = 1 - Math.pow(1 - t, 3);
        cam.x = anim.fx + (anim.tx - anim.fx) * e; cam.y = anim.fy + (anim.ty - anim.fy) * e;
        if (t === 1) anim = null;
      }
      draw();
      if (inView || anim || Math.abs(vel.x) > .05 || Math.abs(vel.y) > .05) raf = requestAnimationFrame(tick);
    }
    function kick() { if (!raf) raf = requestAnimationFrame(tick); }
    var inView = false;
    inView = true; kick();

    /* drag to pan, with momentum */
    var dragging = false, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, moved = 0, anim = null;
    cv.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || e.target.closest('button')) return;
      dragging = true; moved = 0; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now();
      vel.x = vel.y = 0; anim = null; lastAct = lt;
    });
    window.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - lx, dy = e.clientY - ly, now = performance.now();
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 6) { cv.classList.add('drag', 'moved'); if (!cv.hasPointerCapture(e.pointerId)) try { cv.setPointerCapture(e.pointerId); } catch (x) {} }
      cam.x -= dx; cam.y -= dy;
      var dt = Math.max(1, now - lt); vel.x = -dx / dt * 16; vel.y = -dy / dt * 16;
      lx = e.clientX; ly = e.clientY; lt = now; lastAct = now; kick();
    });
    function end() { if (!dragging) return; dragging = false; cv.classList.remove('drag'); if (still) vel.x = vel.y = 0; kick(); }
    window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);

    /* wheel and trackpad pan only in full screen, so the page still scrolls normally */
    cv.addEventListener('wheel', function (e) {
      e.preventDefault(); cam.x += e.deltaX; cam.y += e.deltaY; vel.x = vel.y = 0; lastAct = performance.now(); cv.classList.add('moved'); kick();
    }, { passive: false });

    /* keyboard: arrows pan, Enter opens the photo nearest the centre */
    cv.addEventListener('keydown', function (e) {
      var s = 120, d = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
      if (d) { e.preventDefault(); anim = { fx: cam.x, fy: cam.y, tx: cam.x + d[0], ty: cam.y + d[1], t0: performance.now() }; lastAct = performance.now(); cv.classList.add('moved'); kick(); }
      else if (e.key === 'Enter') { var c = nearest(); if (c >= 0) openLb(c); }
    });
    function nearest() {
      var W = cv.clientWidth, H = cv.clientHeight, best = -1, bd = 1e12;
      for (var k in live) { var r = live[k].getBoundingClientRect(), b = cv.getBoundingClientRect();
        var dx = r.left + r.width / 2 - b.left - W / 2, dy = r.top + r.height / 2 - b.top - H / 2, dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = +live[k].getAttribute('data-i'); } }
      return best;
    }

    /* topic chips fly the camera to the nearest copy of that cluster */
    

    window.addEventListener('resize', kick);

    /* click opens the full-size photo */
    world.addEventListener('click', function (e) { if (moved > 6) return; var f = e.target.closest('.cv-it'); if (f) openLb(+f.getAttribute('data-i')); });
    var lb = document.getElementById('lb'), lbc = document.getElementById('lbc'), cur = -1;
    function show(i) { cur = i; var it = ITEMS[i];
      lbc.innerHTML = (it.type === 'video' ? '<video src="' + esc(it.hd || it.src) + '" controls autoplay playsinline></video>' : '<img src="' + esc(it.src) + '" alt="' + esc(it.t) + '">') + '<figcaption>' + esc(it.t) + '<span>' + esc(it.cat) + '</span></figcaption>'; }
    function openLb(i) { show(i); lb.classList.add('on'); document.getElementById('lbx').focus(); }
    function closeLb() { lb.classList.remove('on'); lbc.innerHTML = ''; cv.focus(); }
    function step(d) { show((cur + d + ITEMS.length) % ITEMS.length); }
    document.getElementById('lbx').addEventListener('click', closeLb);
    document.getElementById('lbp').addEventListener('click', function () { step(-1); });
    document.getElementById('lbn').addEventListener('click', function () { step(1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('on')) return;
      e.stopPropagation();
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    }, true);

    draw();
  })();
</script>
</body>
</html>
